<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · 林运维个人主页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap-wide nav">
      <a class="nav-brand" href="index.html"><span class="nav-logo">林</span>林运维 · 个人主页</a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="dashboard.html">数据看板</a>
        <a href="system-menus.html">系统管理</a>
        <a href="query-vehicles.html">查询统计</a>
        <a href="files.html">文件管理</a>
      </nav>
      <div class="nav-actions">
        <a class="btn btn-line btn-sm" href="login.html">登录</a>
        <button class="hamburger">☰</button>
      </div>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-panel">
      <div class="auth-box">
        <h1>创建账号</h1>
        <p class="sub">已有账号？<a href="login.html">直接登录 →</a></p>

        <div class="tabs" style="margin-bottom:16px">
          <button class="tab active" type="button" data-reg-tab="phone">📱 手机注册</button>
          <button class="tab" type="button" data-reg-tab="email">✉️ 邮箱注册</button>
        </div>

        <!-- 手机注册 -->
        <form id="regPhoneForm" novalidate>
          <div class="form-row">
            <div class="field">
              <label>姓名<span class="req">*</span></label>
              <input class="input" id="regName" data-rule="required|min:2" placeholder="真实姓名">
              <div class="field-msg"></div>
            </div>
            <div class="field">
              <label>所属单位<span class="req">*</span></label>
              <select class="select" id="regDept" data-rule="required">
                <option value="">请选择</option>
                <option>园区运营中心</option>
                <option>卡口管理部</option>
                <option>通关服务部</option>
                <option>边民互助组</option>
              </select>
              <div class="field-msg"></div>
            </div>
          </div>
          <div class="field">
            <label>手机号<span class="req">*</span></label>
            <input class="input" id="regPhone" data-rule="required" maxlength="11" placeholder="11 位手机号">
            <div class="field-msg"></div>
          </div>
          <div class="field">
            <label>验证码<span class="req">*</span></label>
            <div class="captcha-row">
              <input class="input" id="regCode" data-rule="required" maxlength="6" placeholder="6 位验证码">
              <button class="btn btn-line" type="button" id="regSendBtn">获取验证码</button>
            </div>
            <div class="field-msg"></div>
          </div>
          <div class="field">
            <label class="checkline"><input type="checkbox" id="regAgree"> 我已阅读并同意<a href="#" class="btn-link" onclick="App.toast('注册即表示同意用户协议与隐私政策','warn');return false">《用户协议》</a>和<a href="#" class="btn-link" onclick="App.toast('注册即表示同意用户协议与隐私政策','warn');return false">《隐私政策》</a></label>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">注 册</button>
        </form>

        <!-- 邮箱注册 -->
        <form id="regEmailForm" class="hidden" novalidate>
          <div class="form-row">
            <div class="field">
              <label>姓名<span class="req">*</span></label>
              <input class="input" id="regName2" data-rule="required|min:2" placeholder="真实姓名">
              <div class="field-msg"></div>
            </div>
            <div class="field">
              <label>所属单位<span class="req">*</span></label>
              <select class="select" id="regDept2" data-rule="required">
                <option value="">请选择</option>
                <option>园区运营中心</option>
                <option>卡口管理部</option>
                <option>通关服务部</option>
                <option>边民互助组</option>
              </select>
              <div class="field-msg"></div>
            </div>
          </div>
          <div class="field">
            <label>邮箱<span class="req">*</span></label>
            <input class="input" id="regEmail" data-rule="required" placeholder="you@example.com">
            <div class="field-msg"></div>
          </div>
          <div class="field">
            <label>验证码<span class="req">*</span></label>
            <div class="captcha-row">
              <input class="input" id="regEmailCode" data-rule="required" maxlength="6" placeholder="6 位验证码">
              <button class="btn btn-line" type="button" id="regEmailSendBtn">获取验证码</button>
            </div>
            <div class="field-msg"></div>
          </div>
          <div class="field">
            <label class="checkline"><input type="checkbox" id="regAgree2"> 我已阅读并同意<a href="#" class="btn-link" onclick="App.toast('注册即表示同意用户协议与隐私政策','warn');return false">《用户协议》</a>和<a href="#" class="btn-link" onclick="App.toast('注册即表示同意用户协议与隐私政策','warn');return false">《隐私政策》</a></label>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">注 册</button>
        </form>

        <div class="field-msg" id="regNotice" style="margin-top:12px"></div>
        <div class="auth-tip">📝 注册后需管理员审核（系统管理 → 用户管理 → 注册审核），审核通过即可登录使用。</div>
      </div>
    </div>
    <div class="auth-visual">
      <img src="assets/img/banner3.png" alt="科技背景">
      <div class="slogan">
        <h2>加入场站数字化 🚀</h2>
        <p>一个账号，贯通车辆监管、卡口核放、申报统计与文件管理。</p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap-wide">
      <div class="copyright" style="border:none;justify-content:center">
        <span>© 2026 林运维 · 个人主页 · 数据实时云端存储</span>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="js/cloud-config.js"></script>
  <script src="js/cloud.js"></script>
  <script>
    (function () {
      var $ = function (s) { return document.querySelector(s); };
      var notice = $("#regNotice");
      var pending = null;
      var countdown = 0, timer = null;

      function tip(msg, ok) {
        notice.textContent = msg || "";
        notice.style.color = ok === false ? "#dc2626" : ok === true ? "#16a34a" : "#64748b";
      }
      function guard() {
        if (!window.Cloud.isReady()) { tip("当前域名未接入云服务，无法注册。请使用 WorkBuddy 托管域名打开本站。", false); return false; }
        return true;
      }
      function startCountdown(btn) {
        countdown = 60;
        btn.disabled = true;
        btn.textContent = countdown + "s 后重发";
        timer = setInterval(function () {
          countdown--;
          if (countdown <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = "获取验证码"; }
          else btn.textContent = countdown + "s 后重发";
        }, 1000);
      }

      document.querySelectorAll("[data-reg-tab]").forEach(function (tab) {
        tab.addEventListener("click", function () {
          document.querySelectorAll("[data-reg-tab]").forEach(function (t) { t.classList.remove("active"); });
          tab.classList.add("active");
          var isPhone = tab.dataset.regTab === "phone";
          $("#regPhoneForm").classList.toggle("hidden", !isPhone);
          $("#regEmailForm").classList.toggle("hidden", isPhone);
          tip("");
        });
      });

      /* 手机注册：发送验证码 */
      $("#regSendBtn").addEventListener("click", async function () {
        if (!guard()) return;
        var btn = this;
        var phone = $("#regPhone").value.trim();
        if (!window.Cloud.validPhone(phone)) { tip("请输入正确的 11 位手机号", false); return; }
        btn.disabled = true; btn.textContent = "发送中…";
        var res = await window.Cloud.sendPhoneCode(phone);
        if (res.error) { tip(res.error.message, false); btn.disabled = false; btn.textContent = "获取验证码"; return; }
        pending = { phone: phone, verificationId: res.data.verificationId, isExistingUser: res.data.isExistingUser };
        tip("验证码已发送，5 分钟内有效", true);
        startCountdown(btn);
      });

      $("#regPhoneForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        if (!guard()) return;
        var name = $("#regName").value.trim(), dept = $("#regDept").value;
        var code = $("#regCode").value.trim();
        if (name.length < 2) { tip("请输入真实姓名", false); return; }
        if (!dept) { tip("请选择所属单位", false); return; }
        if (!$("#regAgree").checked) { tip("请先同意用户协议", false); return; }
        if (!code) { tip("请输入验证码", false); return; }
        if (!pending) { tip("请先获取验证码", false); return; }
        var btn = this.querySelector("button[type=submit]");
        btn.disabled = true; btn.textContent = "提交中…";
        var res = await window.Cloud.register({
          phone: pending.phone, verificationId: pending.verificationId,
          isExistingUser: pending.isExistingUser, token: code,
          name: name, dept: dept
        });
        if (res.error) { tip(res.error.message, false); btn.disabled = false; btn.textContent = "注 册"; return; }
        tip("注册成功！请等待管理员审核，通过后即可登录。", true);
        setTimeout(function () { location.href = "login.html"; }, 1600);
      });

      /* 邮箱注册：发送验证码 */
      $("#regEmailSendBtn").addEventListener("click", async function () {
        if (!guard()) return;
        var btn = this;
        var email = $("#regEmail").value.trim();
        if (!window.Cloud.validEmail(email)) { tip("请输入正确的邮箱地址", false); return; }
        btn.disabled = true; btn.textContent = "发送中…";
        var res = await window.Cloud.sendEmailCode(email);
        if (res.error) { tip(res.error.message, false); btn.disabled = false; btn.textContent = "获取验证码"; return; }
        pending = { email: email, verificationId: res.data.verificationId, isExistingUser: res.data.isExistingUser };
        tip("验证码已发送，5 分钟内有效", true);
        startCountdown(btn);
      });

      $("#regEmailForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        if (!guard()) return;
        var name = $("#regName2").value.trim(), dept = $("#regDept2").value;
        var code = $("#regEmailCode").value.trim();
        if (name.length < 2) { tip("请输入真实姓名", false); return; }
        if (!dept) { tip("请选择所属单位", false); return; }
        if (!$("#regAgree2").checked) { tip("请先同意用户协议", false); return; }
        if (!code) { tip("请输入验证码", false); return; }
        if (!pending) { tip("请先获取验证码", false); return; }
        var btn = this.querySelector("button[type=submit]");
        btn.disabled = true; btn.textContent = "提交中…";
        var res = await window.Cloud.register({
          email: pending.email, verificationId: pending.verificationId,
          isExistingUser: pending.isExistingUser, token: code,
          name: name, dept: dept
        });
        if (res.error) { tip(res.error.message, false); btn.disabled = false; btn.textContent = "注 册"; return; }
        tip("注册成功！请等待管理员审核，通过后即可登录。", true);
        setTimeout(function () { location.href = "login.html"; }, 1600);
      });
    })();
  </script>
</body>
</html>
