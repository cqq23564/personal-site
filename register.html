<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · 林运维个人主页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap-wide nav">
      <a class="nav-brand" href="index.html"><span class="nav-logo">林</span>林运维 · 个人主页</a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="dashboard.html">数据看板</a>
        <a href="system-menus.html">系统管理</a>
        <a href="query-vehicles.html">查询统计</a>
        <a href="files.html">文件管理</a>
      </nav>
      <div class="nav-actions">
        <a class="btn btn-line btn-sm" href="login.html">登录</a>
        <button class="hamburger">☰</button>
      </div>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-panel">
      <div class="auth-box">
        <h1>创建账号</h1>
        <p class="sub">已有账号？<a href="login.html">直接登录 →</a></p>
        <form data-validate data-done="注册成功，请等待审核…" id="regForm" novalidate>
          <div class="form-row">
            <div class="field">
              <label>姓名<span class="req">*</span></label>
              <input class="input" id="regName" data-rule="required|min:2" placeholder="真实姓名">
              <div class="field-msg"></div>
            </div>
            <div class="field">
              <label>账号<span class="req">*</span></label>
              <input class="input" id="regAccount" data-rule="required|account" placeholder="字母开头，4-16 位">
              <div class="field-msg"></div>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label>手机号<span class="req">*</span></label>
              <input class="input" id="regPhone" data-rule="required|phone" maxlength="11" placeholder="11 位手机号">
              <div class="field-msg"></div>
            </div>
            <div class="field">
              <label>邮箱</label>
              <input class="input" id="regMail" data-rule="email" placeholder="选填">
              <div class="field-msg"></div>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label>密码<span class="req">*</span></label>
              <input class="input" type="password" id="regPwd" data-rule="required|pwd" placeholder="6-18 位，含字母和数字">
              <div class="field-msg"></div>
            </div>
            <div class="field">
              <label>确认密码<span class="req">*</span></label>
              <input class="input" type="password" id="regPwd2" data-rule="required" placeholder="再输入一次">
              <div class="field-msg"></div>
            </div>
          </div>
          <div class="field">
            <label>所属单位<span class="req">*</span></label>
            <select class="select" id="regDept" data-rule="required">
              <option value="">请选择</option>
              <option>园区运营中心</option>
              <option>卡口管理部</option>
              <option>通关服务部</option>
              <option>边民互助组</option>
            </select>
            <div class="field-msg"></div>
          </div>
          <div class="field">
            <label class="checkline"><input type="checkbox" id="regAgree"> 我已阅读并同意<a href="#" class="btn-link" onclick="App.toast('演示站点','warn');return false">《用户协议》</a>和<a href="#" class="btn-link" onclick="App.toast('演示站点','warn');return false">《隐私政策》</a></label>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">注 册</button>
        </form>
        <div class="auth-tip">📝 注册后需管理员审核（系统管理 → 注册审核），审核通过即可登录。</div>
      </div>
    </div>
    <div class="auth-visual">
      <img src="assets/img/banner3.png" alt="科技背景">
      <div class="slogan">
        <h2>加入场站数字化 🚀</h2>
        <p>一个账号，贯通车辆监管、卡口核放、申报统计与文件管理。</p>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap-wide">
      <div class="copyright" style="border:none;justify-content:center">
        <span>© 2026 林运维 · 个人主页 · 仅作学习与演示用途</span>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById("regForm").addEventListener("submit", function (e) {
      const p1 = document.getElementById("regPwd").value, p2 = document.getElementById("regPwd2").value;
      if (p1 !== p2) { App.toast("两次输入的密码不一致", "err"); e.stopImmediatePropagation(); return; }
      if (!document.getElementById("regAgree").checked) { App.toast("请先同意用户协议", "warn"); e.stopImmediatePropagation(); return; }
      const btn = this.querySelector("button[type=submit]");
      btn.disabled = true; btn.textContent = "提交中…";
      setTimeout(() => location.href = "login.html", 1000);
    });
  </script>
</body>
</html>
