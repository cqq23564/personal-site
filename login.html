<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 林运维个人主页</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap-wide nav">
      <a class="nav-brand" href="index.html"><span class="nav-logo">林</span>林运维 · 个人主页</a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="dashboard.html">数据看板</a>
        <a href="system-menus.html">系统管理</a>
        <a href="query-vehicles.html">查询统计</a>
        <a href="files.html">文件管理</a>
      </nav>
      <div class="nav-actions">
        <a class="btn btn-line btn-sm" href="register.html">注册</a>
        <button class="hamburger">☰</button>
      </div>
    </div>
  </header>

  <div class="auth-page">
    <div class="auth-visual">
      <img src="assets/img/banner2.png" alt="城市夜景">
      <div class="slogan">
        <h2>欢迎回来 👋</h2>
        <p>登录后可查看数据看板、管理车辆与申报数据。新用户需注册并等待管理员审核。</p>
      </div>
    </div>
    <div class="auth-panel">
      <div class="auth-box">
        <h1>账号登录</h1>
        <p class="sub">还没有账号？<a href="register.html">立即注册 →</a></p>

        <div class="tabs" style="margin-bottom:16px">
          <button class="tab active" type="button" data-login-tab="phone">📱 手机号登录</button>
          <button class="tab" type="button" data-login-tab="email">✉️ 邮箱登录</button>
        </div>

        <!-- 手机号登录 -->
        <form id="loginPhoneForm" novalidate>
          <div class="field">
            <label>手机号<span class="req">*</span></label>
            <input class="input" id="loginPhone" data-rule="required" maxlength="11" placeholder="11 位手机号">
            <div class="field-msg"></div>
          </div>
          <div class="field">
            <label>验证码<span class="req">*</span></label>
            <div class="captcha-row">
              <input class="input" id="loginCode" data-rule="required" maxlength="6" placeholder="6 位验证码">
              <button class="btn btn-line" type="button" id="sendCodeBtn">获取验证码</button>
            </div>
            <div class="field-msg"></div>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">登 录</button>
        </form>

        <!-- 邮箱登录 -->
        <form id="loginEmailForm" class="hidden" novalidate>
          <div class="field">
            <label>邮箱<span class="req">*</span></label>
            <input class="input" id="loginEmail" data-rule="required" placeholder="you@example.com">
            <div class="field-msg"></div>
          </div>
          <div class="field">
            <label>验证码<span class="req">*</span></label>
            <div class="captcha-row">
              <input class="input" id="loginEmailCode" data-rule="required" maxlength="6" placeholder="6 位验证码">
              <button class="btn btn-line" type="button" id="sendEmailCodeBtn">获取验证码</button>
            </div>
            <div class="field-msg"></div>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">登 录</button>
        </form>

        <div class="field-msg" id="loginNotice" style="margin-top:12px"></div>

        <div style="text-align:center;margin:18px 0 14px" class="text-3">— 其他方式 —</div>
        <button class="btn btn-line btn-lg btn-block" type="button" id="wechatLoginBtn">💬 微信登录</button>

        <div class="auth-tip">🔒 登录信息经云服务加密传输；未注册的手机号/邮箱验证通过后将自动创建账号（需审核）。</div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap-wide">
      <div class="copyright" style="border:none;justify-content:center">
        <span>© 2026 林运维 · 个人主页 · 数据实时云端存储</span>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
  <script src="js/cloud-config.js"></script>
  <script src="js/cloud.js"></script>
  <script>
    (function () {
      var $ = function (s) { return document.querySelector(s); };
      var notice = $("#loginNotice");
      var pending = null; // 保存发送验证码后的 challenge
      var countdown = 0, timer = null;

      function tip(msg, ok) {
        notice.textContent = msg || "";
        notice.style.color = ok === false ? "#dc2626" : ok === true ? "#16a34a" : "#64748b";
      }
      function nextUrl() {
        var m = location.search.match(/[?&]next=([^&]+)/);
        return m ? decodeURIComponent(m[1]) : "dashboard.html";
      }
      function startCountdown(btn) {
        countdown = 60;
        btn.disabled = true;
        btn.textContent = countdown + "s 后重发";
        timer = setInterval(function () {
          countdown--;
          if (countdown <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = "获取验证码"; }
          else btn.textContent = countdown + "s 后重发";
        }, 1000);
      }
      function guard() {
        if (!window.Cloud.isReady()) { tip("当前域名未接入云服务，无法登录。请使用 WorkBuddy 托管域名打开本站。", false); return false; }
        return true;
      }
      function release() {
        document.querySelectorAll("button[type=submit]").forEach(function (b) {
          b.disabled = false; b.textContent = "登 录";
        });
      }
      function routeByStatus() {
        var st = window.Cloud.profileStatus();
        if (st === "active") { tip("登录成功，正在进入…", true); setTimeout(function () { location.href = nextUrl(); }, 600); return; }
        if (st === "pending") { tip("登录成功，但账号审核中。管理员通过后即可使用全部功能。", true); release(); return; }
        if (st === "disabled") { tip("该账号已被禁用，请联系管理员。", false); release(); return; }
        if (st === "rejected") { tip("该账号的注册申请未通过审核。", false); release(); return; }
        /* 无资料行：引导去个人中心完善资料（不能卡在“登录中…”） */
        tip("登录成功，正在引导完善个人资料…", true);
        setTimeout(function () { location.href = "profile.html?complete=1"; }, 800);
      }

      /* Tab 切换 */
      document.querySelectorAll("[data-login-tab]").forEach(function (tab) {
        tab.addEventListener("click", function () {
          document.querySelectorAll("[data-login-tab]").forEach(function (t) { t.classList.remove("active"); });
          tab.classList.add("active");
          var isPhone = tab.dataset.loginTab === "phone";
          $("#loginPhoneForm").classList.toggle("hidden", !isPhone);
          $("#loginEmailForm").classList.toggle("hidden", isPhone);
          tip("");
        });
      });

      /* 手机验证码 */
      $("#sendCodeBtn").addEventListener("click", async function () {
        if (!guard()) return;
        var btn = this;
        var phone = $("#loginPhone").value.trim();
        if (!window.Cloud.validPhone(phone)) { tip("请输入正确的 11 位手机号", false); return; }
        btn.disabled = true; btn.textContent = "发送中…";
        var res = await window.Cloud.sendPhoneCode(phone);
        if (res.error) { tip(res.error.message, false); btn.disabled = false; btn.textContent = "获取验证码"; return; }
        pending = { phone: phone, verificationId: res.data.verificationId, isExistingUser: res.data.isExistingUser };
        tip("验证码已发送，5 分钟内有效", true);
        startCountdown(btn);
      });

      $("#loginPhoneForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        if (!guard()) return;
        var code = $("#loginCode").value.trim();
        if (!code) { tip("请输入验证码", false); return; }
        if (!pending) { tip("请先获取验证码", false); return; }
        var btn = this.querySelector("button[type=submit]");
        btn.disabled = true; btn.textContent = "登录中…";
        var res = await window.Cloud.loginWithPhone({ phone: pending.phone, verificationId: pending.verificationId, isExistingUser: pending.isExistingUser, token: code });
        if (res.error) { tip(res.error.message, false); btn.disabled = false; btn.textContent = "登 录"; return; }
        pending = null;
        routeByStatus();
      });

      /* 邮箱验证码 */
      $("#sendEmailCodeBtn").addEventListener("click", async function () {
        if (!guard()) return;
        var btn = this;
        var email = $("#loginEmail").value.trim();
        if (!window.Cloud.validEmail(email)) { tip("请输入正确的邮箱地址", false); return; }
        btn.disabled = true; btn.textContent = "发送中…";
        var res = await window.Cloud.sendEmailCode(email);
        if (res.error) { tip(res.error.message, false); btn.disabled = false; btn.textContent = "获取验证码"; return; }
        pending = { email: email, verificationId: res.data.verificationId, isExistingUser: res.data.isExistingUser };
        tip("验证码已发送，5 分钟内有效", true);
        startCountdown(btn);
      });

      $("#loginEmailForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        if (!guard()) return;
        var code = $("#loginEmailCode").value.trim();
        if (!code) { tip("请输入验证码", false); return; }
        if (!pending) { tip("请先获取验证码", false); return; }
        var btn = this.querySelector("button[type=submit]");
        btn.disabled = true; btn.textContent = "登录中…";
        var res = await window.Cloud.loginWithEmail({ email: pending.email, verificationId: pending.verificationId, isExistingUser: pending.isExistingUser, token: code });
        if (res.error) { tip(res.error.message, false); btn.disabled = false; btn.textContent = "登 录"; return; }
        pending = null;
        routeByStatus();
      });

      /* 微信登录 */
      $("#wechatLoginBtn").addEventListener("click", async function () {
        if (!guard()) return;
        var res = await window.Cloud.signInWithWechat();
        if (res.error) tip(res.error.message, false);
      });

      /* 已登录则直接前往（等待云端会话恢复完成，避免恢复前误判） */
      var redirected = false;
      function goIfLoggedIn() {
        if (redirected) return;
        if (window.Cloud.isReady() && window.Cloud.isLoggedIn() && window.Cloud.profileStatus() === "active") {
          redirected = true;
          tip("已登录，正在进入…", true);
          setTimeout(function () { location.href = nextUrl(); }, 500);
        }
      }
      goIfLoggedIn();
      window.Cloud.onChange(goIfLoggedIn);
    })();
  </script>
</body>
</html>
